on: push

name: integration

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-virsion:
          - 3.11
          - 3.12
          - 3.13
    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run project
        run: |
          python3 main.py &
          echo $! > server.pid
          sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health
          echo "Health check passed."

      - name: Kill server
        run: |
          kill $(cat server.pid)

  docker-build:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build
        run: |
          docker build .
