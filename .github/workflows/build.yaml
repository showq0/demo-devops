on: push

name: integration

jobs:
  build:
    runs-on: ubuntu-20.40
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: true
      - name: Run project
        run: |
          python3 main.py &
          echo $! > server.pid
          sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:3000/health
          echo "Health check passed."

      - name: Kill server
        run: |
          kill $(cat server.pid)
