on: push

name: integration

jobs:
  build:
    runs-on: ubuntu-20.40
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: true
      - name: Run project
        run: |
          python3 main.py &
          echo $! > server.pid
          sleep 5
